name: Release

# tag 触发（v1.2.5 之类）：跑测试 → build-installers.ps1 产出双架构 setup.exe
# → 挂到 GitHub Release。打包脚本自包含（rustup / VS / 7-Zip / Python 在
# windows-latest runner 上都已预装或自动定位）。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build installers & publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ hashFiles('Cargo.lock') }}
          # 先续 release 自己的最近缓存，再回落到 CI 的 x64 缓存 ——
          # 发版不再每次全冷启动（Cargo.lock 变更也不至于从零编译）。
          restore-keys: |
            release-
            ci-x86_64-pc-windows-msvc-

      # tag 与 Cargo.toml 版本必须一致 —— 打错 tag 会产出错版安装包还挂着
      # 对不上的 Release 号。
      - name: Verify tag matches Cargo.toml version
        shell: pwsh
        run: |
          $cargoVersion = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$cargoVersion") {
            throw "tag '$env:GITHUB_REF_NAME' does not match Cargo.toml version '$cargoVersion' (expected 'v$cargoVersion')"
          }
          "tag $env:GITHUB_REF_NAME matches version $cargoVersion"

      - name: Test
        run: cargo test

      # 产物：installer\dist\everything-mcp-<版本>-{x64,x86}-setup.exe
      - name: Build installers
        shell: pwsh
        run: installer\build-installers.ps1

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          # 发布说明用仓库根目录的 RELEASE_NOTES.md（中英双语，每次发版随
          # 版本号一起更新）；文件不存在时退回自动生成的提交列表。
          if (Test-Path RELEASE_NOTES.md) {
            gh release create $tag --title $tag --notes-file RELEASE_NOTES.md installer\dist\everything-mcp-*-setup.exe
          } else {
            gh release create $tag --title $tag --generate-notes installer\dist\everything-mcp-*-setup.exe
          }
